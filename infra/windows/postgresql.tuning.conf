# Appended to postgresql.conf by install.ps1 (include_if_exists). Sized for a 6 GB VPS
# that already runs other software: Postgres stays well under 1 GB.
listen_addresses = 'localhost'
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_buffers = 8MB
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
autovacuum_max_workers = 2
log_min_duration_statement = 2000
timezone = 'UTC'
